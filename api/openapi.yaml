openapi: 3.1.0
info:
  title: Media Hub API
  version: 0.19.39
  description: Control-plane API for private media search, subscriptions, and automation.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/configuration:
    get:
      operationId: getAuthConfiguration
      summary: Check whether the administrator has been initialized
      responses:
        '200':
          description: Authentication configuration state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfiguration'
  /auth/login:
    post:
      operationId: login
      summary: Create a revocable Web or Android session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session. Web sessions are also set as HttpOnly cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
  /auth/session:
    get:
      operationId: getSession
      summary: Read the current authenticated session
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
  /auth/password:
    put:
      operationId: changePassword
      summary: Change the administrator password and revoke other sessions
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '422': { $ref: '#/components/responses/ProblemResponse' }
  /client/android/releases/latest:
    get:
      operationId: getLatestAndroidRelease
      summary: Read the latest private Android release metadata
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Latest signed Android release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AndroidRelease' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /client/android/releases/{versionCode}/apk:
    get:
      operationId: downloadAndroidRelease
      summary: Download one authenticated signed Android APK
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: versionCode
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Signed Android APK
          headers:
            X-Checksum-SHA256:
              schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          content:
            application/vnd.android.package-archive:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /system/overview:
    get:
      operationId: getSystemOverview
      summary: Read current integration health
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Integration overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOverview'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /integrations/sources/checkins:
    get:
      operationId: listSourceCheckIns
      summary: Read daily resource-source check-in status
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Configured source check-in statuses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceCheckInStatus' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/sources/checkins/{id}/retry:
    post:
      operationId: retrySourceCheckIn
      summary: Queue a source check-in to run again today
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 50, pattern: '^[a-z0-9][a-z0-9_-]{0,49}$' }
      responses:
        '202':
          description: Check-in queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceCheckIn' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /settings/providers:
    get:
      operationId: getProviderSettings
      summary: Read non-secret runtime provider settings and secret-presence flags
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Runtime provider settings without secret values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderSettings' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
    put:
      operationId: updateProviderSettings
      summary: Atomically encrypt, persist, and apply runtime provider settings
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderSettingsUpdate' }
      responses:
        '200':
          description: Updated settings without secret values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderSettings' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '422': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /statistics/summary:
    get:
      operationId: getStatisticsSummary
      summary: Read user-scoped Media Hub operational counters
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Operational counters without provider-private data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalStatistics' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
  /discovery/trending:
    get:
      operationId: getTrending
      summary: Read normalized weekly TMDB trending identities
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: mediaType
          in: query
          schema: { type: string, enum: [all, movie, series], default: all }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Trending media identities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /discovery/catalog:
    get:
      operationId: getDiscoveryCatalog
      summary: Read TMDB popular, top-rated, or genre discovery lists
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [popular, top_rated, genre] }
        - name: mediaType
          in: query
          required: true
          schema: { type: string, enum: [movie, series] }
        - name: genreId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Catalog media identities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /discovery/genres:
    get:
      operationId: getDiscoveryGenres
      summary: Read TMDB genre labels for discovery chips
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: mediaType
          in: query
          schema: { type: string, enum: [movie, series], default: movie }
      responses:
        '200':
          description: Genre list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryGenresResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /discovery/{mediaType}/{tmdbId}/recommendations:
    get:
      operationId: getRecommendations
      summary: Read normalized TMDB recommendations for one identity
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: mediaType
          in: path
          required: true
          schema: { type: string, enum: [movie, series] }
        - name: tmdbId
          in: path
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Recommended media identities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /search:
    get:
      operationId: searchMedia
      summary: Search normalized resource candidates
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        '200':
          description: Search response, including per-source partial failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
  /integrations/wecom/test:
    post:
      operationId: testWeComNotification
      summary: Send one fixed test notification through the current Enterprise WeChat configuration
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200':
          description: Test notification accepted by Enterprise WeChat
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string, enum: [sent] } }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/qmediasync/status:
    get:
      operationId: getQMediaSyncStatus
      summary: Read QMediaSync version and recent synchronization records
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: QMediaSync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QMediaSyncStatus'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        '504':
          $ref: '#/components/responses/ProblemResponse'
  /integrations/emby/libraries:
    get:
      operationId: getEmbyLibraries
      summary: Read configured Emby media libraries
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Emby libraries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyLibraryResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        '504':
          $ref: '#/components/responses/ProblemResponse'
  /integrations/emby/items:
    get:
      operationId: searchEmbyItems
      summary: Search Emby for duplicate movies or series
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Matching Emby items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyItemSearchResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        '504':
          $ref: '#/components/responses/ProblemResponse'
  /integrations/emby/libraries/{id}/items:
    get:
      operationId: browseEmbyLibraryItems
      summary: Browse movies and series in one Emby library
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Emby library items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbyItemSearchResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
        '504': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/emby/libraries/{id}/refresh:
    post:
      operationId: refreshEmbyLibrary
      summary: Ask Emby to refresh one media library
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '202':
          description: Emby refresh accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbyRefreshResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
        '504': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/emby/items/{id}:
    get:
      operationId: getEmbyItem
      summary: Read safe metadata for one Emby item
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
      responses:
        '200':
          description: Emby item metadata without file paths or credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbyItemDetail' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
        '504': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/emby/items/{id}/episodes:
    get:
      operationId: getEmbyEpisodes
      summary: List playable episodes with item-specific Emby fallback URLs
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
      responses:
        '200':
          description: Playable episodes ordered by season and episode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbyEpisodeList' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/emby/items/{id}/primary-image:
    get:
      operationId: getEmbyPrimaryImage
      summary: Read a bounded Emby poster without exposing the Emby API key
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
      responses:
        '200':
          description: Bounded primary poster image
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/emby/items/{id}/refresh:
    post:
      operationId: refreshEmbyItem
      summary: Ask Emby to refresh one media item
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '202':
          description: Emby refresh accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbyRefreshResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
        '504': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/emby/items/{id}/remote-subtitles:
    get:
      operationId: searchEmbyRemoteSubtitles
      summary: Search Emby remote subtitle providers for one item
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
        - name: language
          in: query
          schema: { type: string, minLength: 2, maxLength: 16, default: chi }
          description: ISO language code; Chinese defaults try chi then zh
      responses:
        '200':
          description: Remote subtitle candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbyRemoteSubtitleList' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
        '504': { $ref: '#/components/responses/ProblemResponse' }
    post:
      operationId: downloadEmbyRemoteSubtitle
      summary: Download one Emby remote subtitle onto the item
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbyRemoteSubtitleDownloadRequest' }
      responses:
        '202':
          description: Subtitle download accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbyRefreshResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
        '504': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/emby/items/{id}/delete-preview:
    get:
      operationId: previewEmbyItemDelete
      summary: Preview an Emby library delete without exposing filesystem paths
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
      responses:
        '200':
          description: Safe delete preview; 115 cloud files are never included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbyDeletePreview' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
        '504': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/emby/items/{id}/delete:
    post:
      operationId: deleteEmbyItem
      summary: Delete one Emby item from the library and NAS files after ID confirmation
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        '200':
          description: Emby item deleted; 115 cloud files are unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbyDeleteResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '502': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
        '504': { $ref: '#/components/responses/ProblemResponse' }
  /integrations/115/status:
    get:
      operationId: getDrive115Status
      summary: Check 115 QR authorization without returning account identity
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: 115 authorization and storage status
          content:
            application/json:
              schema:
