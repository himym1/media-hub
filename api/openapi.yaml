      responses:
        '204':
          description: Transfer record deleted
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
  /transfers/{transferId}/retry:
    post:
      operationId: retryTransfer
      summary: Explicitly retry a failed or uncertain transfer
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '202':
          description: Job queued for retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJob'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
  /transfers/{transferId}/archived:
    patch:
      operationId: setTransferArchived
      summary: Archive or restore a completed transfer record without deleting external media
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: transferId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTransferArchivedRequest' }
      responses:
        '200':
          description: Updated local transfer record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferJob' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
  /subscriptions/backup:
    get:
      operationId: exportSubscriptions
      summary: Export native subscriptions without run history or secrets
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Subscription backup
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionBackup' }
    post:
      operationId: importSubscriptions
      summary: Atomically merge a validated native subscription backup
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionBackup' }
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionImportResult' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
  /subscriptions/batch/enabled:
    post:
      operationId: setSubscriptionsBatchEnabled
      summary: Atomically enable or pause native subscriptions
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, enabled]
              properties:
                ids: { type: array, minItems: 1, maxItems: 1000, items: { type: string } }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated subscription list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionListResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
  /notifications:
    get:
      operationId: listTransferNotifications
      summary: List persisted Enterprise WeChat transfer notifications
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications: { type: array, items: { $ref: '#/components/schemas/TransferNotification' } }
        '401': { $ref: '#/components/responses/ProblemResponse' }
  /notifications/{jobId}/{eventType}/retry:
    post:
      operationId: retryTransferNotification
      summary: Explicitly resend an uncertain Enterprise WeChat notification
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: eventType, in: path, required: true, schema: { type: string, enum: [completed, failed, needs_attention] } }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: 'Must equal jobId:eventType' }
      responses:
        '202':
          description: Notification queued after explicit duplicate-delivery confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferNotification' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: media_hub_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for state-changing requests authenticated by Web cookie.
      schema:
        type: string
    SubscriptionID:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,100}$'
  responses:
    ProblemResponse:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthResponse:
      type: object
      required: [status, version, time]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        time:
          type: string
          format: date-time
    AndroidRelease:
      type: object
      required: [versionCode, versionName, minimumSupportedVersionCode, sha256, sizeBytes, publishedAt, notes, downloadPath]
      properties:
        versionCode: { type: integer, minimum: 1 }
        versionName: { type: string }
        minimumSupportedVersionCode: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        publishedAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 4000 }
        downloadPath: { type: string, pattern: '^/api/v1/client/android/releases/[1-9][0-9]*/apk$' }
    AuthConfiguration:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 1024 }
        newPassword: { type: string, minLength: 12, maxLength: 1024 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password, client]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        client:
          type: string
          enum: [web, android]
    LoginResponse:
      type: object
      required: [authenticated, client, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        client:
          type: string
          enum: [web, android]
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
          description: Returned only for Android sessions.
        csrfToken:
          type: string
          description: Returned only for Web sessions.
    SessionResponse:
      type: object
      required: [authenticated, client, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        client:
          type: string
          enum: [web, android]
        expiresAt:
          type: string
          format: date-time
    IntegrationHealth:
      type: object
      required: [id, label, status, detail]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [healthy, degraded, unavailable, unconfigured]
        detail:
          type: string
    SystemOverview:
      type: object
      required: [integrations]
      properties:
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationHealth'
    SecretStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
    SecretUpdate:
      type: object
      properties:
        value: { type: string, maxLength: 4096, writeOnly: true }
        clear: { type: boolean, default: false }
    WorkflowTargetSettings:
      type: object
      required: [destinationId, qMediaSyncTargetPath, embyLibraryId]
      properties:
        destinationId: { type: string, maxLength: 200 }
        qMediaSyncTargetPath: { type: string, maxLength: 2048 }
        embyLibraryId: { type: string, maxLength: 200 }
    WorkflowSettings:
      type: object
      required: [qMediaSyncAccountId, movie, series]
      properties:
        qMediaSyncAccountId: { type: integer, minimum: 0, maximum: 4294967295 }
        movie: { $ref: '#/components/schemas/WorkflowTargetSettings' }
        series: { $ref: '#/components/schemas/WorkflowTargetSettings' }
    CheckInSettings:
      type: object
      required: [enabled, hour, minute, sources]
      properties:
        enabled: { type: boolean, description: 是否按北京时间自动签到 }
        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59 }
        sources:
          type: array
          items: { type: string, enum: [framehdr, juying] }
    SourceSettings:
      type: object
      required: [id, label, baseUrl, account, authMode, token]
      properties:
        id: { type: string, enum: [dian, framehdr, gimy, guanying, hdhive, juying, mikan, sidhub] }
        label: { type: string }
        baseUrl: { type: string, maxLength: 2048 }
        account: { type: string, maxLength: 200 }
        authMode: { type: string, enum: ['', web, developer], description: 聚影认证模式；其他来源为空字符串 }
        token: { $ref: '#/components/schemas/SecretStatus' }
    SourceSettingsUpdate:
      type: object
      required: [id, baseUrl, token]
      properties:
        id: { type: string, enum: [dian, framehdr, gimy, guanying, hdhive, juying, mikan, sidhub] }
        baseUrl: { type: string, maxLength: 2048 }
        account: { type: string, maxLength: 200 }
        authMode: { type: string, enum: ['', web, developer], description: 可选以兼容旧客户端；显式切换会清空原模式凭据 }
        token: { $ref: '#/components/schemas/SecretUpdate' }
    ProviderSettings:
      type: object
      required: [qmediaSync, emby, drive115, tmdb, wecom, workflow, checkIn, sources]
      properties:
        qmediaSync:
          type: object
          required: [baseUrl, apiKey]
          properties:
            baseUrl: { type: string }
            apiKey: { $ref: '#/components/schemas/SecretStatus' }
        emby:
          type: object
          required: [baseUrl, apiKey, userId, password]
          properties:
            baseUrl: { type: string }
            apiKey: { $ref: '#/components/schemas/SecretStatus' }
            userId: { type: string }
            password: { $ref: '#/components/schemas/SecretStatus' }
        drive115:
          type: object
          required: [clientId]
          properties:
            clientId: { type: string }
        tmdb:
          type: object
          required: [baseUrl, accessToken]
          properties:
            baseUrl: { type: string }
            accessToken: { $ref: '#/components/schemas/SecretStatus' }
        wecom:
          type: object
          required: [baseUrl, corpId, secret, sendMode, agentId, toUser, chatId]
          properties:
            baseUrl: { type: string, maxLength: 2048 }
            corpId: { type: string, maxLength: 200 }
            secret: { $ref: '#/components/schemas/SecretStatus' }
            sendMode: { type: string, enum: [app, appchat] }
            agentId: { type: integer, format: int64, minimum: 0 }
            toUser: { type: string, maxLength: 200 }
            chatId: { type: string, maxLength: 200 }
        workflow: { $ref: '#/components/schemas/WorkflowSettings' }
        checkIn: { $ref: '#/components/schemas/CheckInSettings' }
        sources:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: '#/components/schemas/SourceSettings' }
    ProviderSettingsUpdate:
      type: object
      required: [qmediaSync, emby, drive115, tmdb, workflow, sources]
      properties:
        qmediaSync:
          type: object
          required: [baseUrl, apiKey]
          properties:
            baseUrl: { type: string, maxLength: 2048 }
            apiKey: { $ref: '#/components/schemas/SecretUpdate' }
        emby:
          type: object
          required: [baseUrl, apiKey, userId]
          properties:
            baseUrl: { type: string, maxLength: 2048 }
            apiKey: { $ref: '#/components/schemas/SecretUpdate' }
            userId: { type: string, maxLength: 200 }
            password: { $ref: '#/components/schemas/SecretUpdate' }
        drive115:
          type: object
          required: [clientId]
          properties:
            clientId: { type: string, maxLength: 200 }
        tmdb:
          type: object
          required: [baseUrl, accessToken]
          properties:
            baseUrl: { type: string, maxLength: 2048 }
            accessToken: { $ref: '#/components/schemas/SecretUpdate' }
        wecom:
          type: object
          required: [baseUrl, corpId, secret, chatId]
          properties:
            baseUrl: { type: string, maxLength: 2048 }
            corpId: { type: string, maxLength: 200 }
            secret: { $ref: '#/components/schemas/SecretUpdate' }
            sendMode: { type: string, enum: [app, appchat] }
            agentId: { type: integer, format: int64, minimum: 0 }
            toUser: { type: string, maxLength: 200 }
            chatId: { type: string, maxLength: 200 }
        workflow: { $ref: '#/components/schemas/WorkflowSettings' }
        checkIn: { $ref: '#/components/schemas/CheckInSettings' }
        sources:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: '#/components/schemas/SourceSettingsUpdate' }
    DiscoveryItem:
      type: object
      required: [tmdbId, title, year, mediaType]
      properties:
        tmdbId: { type: string }
        title: { type: string }
        year: { type: integer }
        mediaType: { type: string, enum: [movie, series] }
        posterUrl: { type: string, format: uri }
    DiscoveryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/DiscoveryItem' }
    DiscoveryGenre:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    DiscoveryGenresResponse:
      type: object
      required: [genres]
      properties:
        genres:
          type: array
          items: { $ref: '#/components/schemas/DiscoveryGenre' }
    SearchResponse:
      type: object
      required: [query, partial, results, sourceErrors]
      properties:
        query:
          type: string
        partial:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchCandidate'
        sourceErrors:
          type: array
          items:
            $ref: '#/components/schemas/SourceError'
    SearchCandidate:
      type: object
      required: [id, title, year, mediaType, source, sourceId, release, transferState]
      properties:
        id:
          type: string
        title:
          type: string
        year:
          type: integer
        season:
          type: integer
          minimum: 0
          maximum: 100
        episodeStart: { type: integer, minimum: 0, maximum: 10000 }
        episodeEnd: { type: integer, minimum: 0, maximum: 10000 }
        mediaType:
          type: string
          enum: [movie, series]
        tmdbId:
          type: string
          pattern: '^[1-9][0-9]*$'
        source:
          type: string
        sourceId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,49}$'
        provider:
          type: string
        posterUrl:
          type: string
          format: uri
        release:
          $ref: '#/components/schemas/ReleaseFacts'
        transferState:
          type: string
          enum: [available, identity_required, unavailable]
        transferToken:
          type: string
          description: Short-lived opaque token required to create a transfer job.
    ReleaseFacts:
      type: object
      required: [resolution, videoCodec, sizeBytes]
      properties:
        resolution:
          type: string
        videoCodec:
          type: string
        dynamicRange:
          type: string
        audio:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
    SourceError:
      type: object
      required: [source, code, message, retryable]
      properties:
        source:
          type: string
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    SourceCheckInStatus:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SourceCheckIn' }
    SourceCheckIn:
      type: object
      required: [sourceId, label, state, retryable, updatedAt]
      properties:
        sourceId: { type: string }
        label: { type: string }
        state: { type: string, enum: [idle, running, completed, skipped, failed, needs_attention] }
        message: { type: string }
        errorCode: { type: string }
        retryable: { type: boolean }
        lastSuccessAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QMediaSyncStatus:
      type: object
      required: [version, recentSyncs, totalSyncs]
      properties:
        version:
          type: string
        releaseDate:
          type: string
        recentSyncs:
          type: array
          items:
            $ref: '#/components/schemas/QMediaSyncRecord'
        totalSyncs:
          type: integer
          minimum: 0
    QMediaSyncRecord:
      type: object
      required: [id, state, totalFiles, newStrm, newMetadata, newUploads]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [queued, running, completed, failed, unknown]
        totalFiles:
          type: integer
          minimum: 0
        newStrm:
          type: integer
          minimum: 0
        newMetadata:
          type: integer
          minimum: 0
        newUploads:
          type: integer
          minimum: 0
        failReason:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    EmbyLibraryResponse:
      type: object
      required: [libraries]
      properties:
        libraries:
          type: array
          items:
            $ref: '#/components/schemas/EmbyLibrary'
    EmbyLibrary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        collectionType:
          type: string
    EmbyItemSearchResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmbyItem'
        total:
          type: integer
          minimum: 0
    EmbyItem:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        year:
          type: integer
        providerIds:
          type: object
          additionalProperties:
            type: string
        season: { type: integer, minimum: 0 }
        episode: { type: integer, minimum: 0 }
        playbackPositionMs: { type: integer, format: int64, minimum: 0 }
        played: { type: boolean }
    EmbyEpisode:
      allOf:
        - $ref: '#/components/schemas/EmbyItem'
        - type: object
          required: [externalUrl]
          properties:
            externalUrl: { type: string, format: uri }
            appUrl: { type: string, format: uri, pattern: '^emby://items/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$' }
    EmbyEpisodeList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EmbyEpisode' } }
        total: { type: integer, minimum: 0 }
    EmbyItemDetail:
      allOf:
        - $ref: '#/components/schemas/EmbyItem'
        - type: object
          required: [mediaSourceCount, externalUrl]
          properties:
            originalTitle: { type: string }
            overview: { type: string, maxLength: 4000 }
            communityRating: { type: number, format: double }
            runtimeMinutes: { type: integer, minimum: 0 }
            genres: { type: array, maxItems: 32, items: { type: string, maxLength: 100 } }
            mediaSourceCount: { type: integer, minimum: 0 }
            externalUrl: { type: string, format: uri }
            appUrl: { type: string, format: uri, pattern: '^emby://items/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$' }
    EmbyRefreshResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [accepted] }
    EmbyRemoteSubtitle:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, minLength: 1, maxLength: 512 }
        name: { type: string, maxLength: 240 }
        language: { type: string, maxLength: 16 }
        format: { type: string, maxLength: 32 }
        providerName: { type: string, maxLength: 80 }
        author: { type: string, maxLength: 80 }
        comment: { type: string, maxLength: 240 }
        communityRating: { type: number, format: double }
        downloadCount: { type: integer, minimum: 0 }
        isHashMatch: { type: boolean }
        hearingImpaired: { type: boolean }
        forced: { type: boolean }
    EmbyRemoteSubtitleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/EmbyRemoteSubtitle' }
    EmbyRemoteSubtitleDownloadRequest:
      type: object
      additionalProperties: false
      required: [subtitleId]
      properties:
        subtitleId: { type: string, minLength: 1, maxLength: 512 }
    EmbyDeletePreview:
      type: object
      additionalProperties: false
      required: [id, name, type, fileCount, deletesFiles, cloudKept, versionCount]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
        name: { type: string }
        type: { type: string }
        fileCount: { type: integer, minimum: 0 }
        deletesFiles: { type: boolean }
        cloudKept: { type: boolean }
        versionCount: { type: integer, minimum: 1 }
    EmbyDeleteResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [deleted] }
    Drive115DeviceAuthorization:
      type: object
      required: [id, state, expiresAt]
      properties:
        id: { type: string }
        qrImage:
          type: string
          pattern: '^data:image/png;base64,'
        state: { type: string, enum: [pending, confirmed, expired, failed] }
        expiresAt: { type: string, format: date-time }
    Drive115File:
      type: object
      required: [id, parentId, name, kind, size, updatedAt]
      properties:
        id: { type: string, pattern: '^[0-9]+$' }
        parentId: { type: string, pattern: '^[0-9]+$' }
        name: { type: string }
        kind: { type: string, enum: [file, folder] }
        size: { type: integer, format: int64, minimum: 0 }
        updatedAt: { type: integer, format: int64, minimum: 0 }
    Drive115FileList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Drive115File' } }
        total: { type: integer, minimum: 0 }
    Drive115PlaybackTarget:
      type: object
      additionalProperties: false
      required: [parentId, fileId]
      properties:
        parentId: { type: string, pattern: '^[0-9]{1,32}$' }
        fileId: { type: string, pattern: '^[0-9]{1,32}$' }
    EmbyPlaybackTarget:
      type: object
      additionalProperties: false
      required: [itemId]
      properties:
        itemId: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    PlaybackDescriptor:
      type: object
      additionalProperties: false
      required: [streamUrl, userAgent, title]
      properties:
        streamUrl: { type: string, format: uri, pattern: '^https://' }
        userAgent: { type: string, minLength: 1, maxLength: 512 }
        title: { type: string, minLength: 1, maxLength: 255 }
        startPositionMs: { type: integer, format: int64, minimum: 0, maximum: 604800000 }
        expiresAt:
          type: string
          format: date-time
          description: Present only when the upstream provides a verifiable expiry.
        sessionId:
          type: string
          pattern: '^[a-f0-9]{48}$'
          description: Opaque user-bound session used to synchronize provider playback progress.
    PlaybackSessionEvent:
      type: object
      additionalProperties: false
      required: [event, positionMs, paused]
      properties:
        event: { type: string, enum: [started, progress, stopped] }
        positionMs: { type: integer, format: int64, minimum: 0, maximum: 604800000 }
        paused: { type: boolean }
    Drive115CommandInput:
      type: object
      required: [operation, params]
      properties:
        operation: { type: string, enum: [create_folder, move, rename, delete] }
        params: { type: object, additionalProperties: true }
    Drive115CommandEvent:
      type: object
      required: [id, state, message, createdAt]
      properties:
        id: { type: integer, format: int64 }
        state: { type: string }
        message: { type: string }
        createdAt: { type: integer, format: int64 }
    Drive115Command:
      type: object
      required: [id, operation, state, attempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        operation: { type: string, enum: [create_folder, move, rename, delete] }
        state: { type: string, enum: [awaiting_confirmation, queued, submitting, completed, failed, needs_attention] }
        attempts: { type: integer, minimum: 0 }
        errorCode: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        events: { type: array, items: { $ref: '#/components/schemas/Drive115CommandEvent' } }
    ArchiveSuggestion:
      type: object
      required: [fileId, currentName, suggestedName, kind, confidence]
      properties:
        fileId: { type: string }
        currentName: { type: string }
        suggestedName: { type: string }
        kind: { type: string, enum: [file, directory] }
        confidence: { type: string, enum: [review] }
    ArchiveStep:
      type: object
      required: [operation, fileId]
      properties:
        operation: { type: string, enum: [rename, move] }
        fileId: { type: string }
        name: { type: string }
        targetParentId: { type: string }
    ArchivePlanEvent:
      type: object
      required: [id, state, message, createdAt]
      properties:
        id: { type: integer, format: int64 }
        state: { type: string }
        message: { type: string }
        createdAt: { type: integer, format: int64 }
    ArchivePlan:
      type: object
      required: [id, state, stepIndex, stepTotal, createdAt, updatedAt]
      properties:
        id: { type: string }
        state: { type: string, enum: [awaiting_confirmation, queued, running, completed, failed, needs_attention] }
        stepIndex: { type: integer }
        stepTotal: { type: integer }
        steps: { type: array, items: { $ref: '#/components/schemas/ArchiveStep' } }
        errorCode: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        events: { type: array, items: { $ref: '#/components/schemas/ArchivePlanEvent' } }
    LocalUploadRoot:
      type: object
      required: [id]
      properties: { id: { type: string, pattern: '^root-[1-9][0-9]*$' } }
    LocalUploadEntry:
      type: object
      required: [name, path, directory, size]
      properties:
        name: { type: string }
        path: { type: string }
        directory: { type: boolean }
        size: { type: integer, format: int64, minimum: 0 }
    LocalUploadEvent:
      type: object
      required: [id, state, message, createdAt]
      properties:
        id: { type: integer, format: int64 }
        state: { type: string }
        message: { type: string }
        createdAt: { type: integer, format: int64 }
    LocalUploadJob:
      type: object
      required: [id, path, state, bytesDone, bytesTotal, createdAt, updatedAt]
      properties:
        id: { type: string }
        path: { type: string }
        state: { type: string, enum: [queued, hashing, submitting_init, uploading, completed, failed, needs_attention] }
        bytesDone: { type: integer, format: int64, minimum: 0 }
        bytesTotal: { type: integer, format: int64, minimum: 0 }
        errorCode: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        events: { type: array, items: { $ref: '#/components/schemas/LocalUploadEvent' } }
    Drive115Status:
      type: object
      required: [authorized]
      properties:
        authorized:
          type: boolean
        usedBytes:
          type: integer
          format: int64
          minimum: 0
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        memberLevel:
          type: string
        expiresAt:
          type: integer
          format: int64
    SubscriptionPreferences:
      type: object
      additionalProperties: false
      required: [resolutions, videoCodecs, dynamicRanges, audioContains, preferredSources, minSizeBytes, maxSizeBytes, allowUnknownSize, preferSmaller]
      properties:
        resolutions: { type: array, maxItems: 16, items: { type: string, maxLength: 80 } }
        videoCodecs: { type: array, maxItems: 16, items: { type: string, maxLength: 80 } }
        dynamicRanges: { type: array, maxItems: 16, items: { type: string, maxLength: 80 } }
        audioContains: { type: array, maxItems: 16, items: { type: string, maxLength: 80 } }
        preferredSources: { type: array, maxItems: 16, items: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,49}$' } }
        minSizeBytes: { type: integer, format: int64, minimum: 0 }
        maxSizeBytes: { type: integer, format: int64, minimum: 0 }
        allowUnknownSize: { type: boolean }
        preferSmaller: { type: boolean }
    CreateSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [tmdbId, title, originalTitle, year, mediaType, season, policy, enabled, intervalMinutes, sourceIds, preferences]
      properties:
        tmdbId: { type: string, pattern: '^[1-9][0-9]{0,19}$' }
        title: { type: string, minLength: 1, maxLength: 300 }
        originalTitle: { type: string, maxLength: 300 }
        year: { type: integer, minimum: 0, maximum: 2100 }
        mediaType: { type: string, enum: [movie, series] }
        season: { type: integer, minimum: 0, maximum: 100 }
        policy: { type: string, enum: [once, upgrade] }
        enabled: { type: boolean }
        intervalMinutes: { type: integer, minimum: 15, maximum: 10080 }
        sourceIds:
          type: array
          maxItems: 16
          items: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,49}$' }
        preferences: { $ref: '#/components/schemas/SubscriptionPreferences' }
    UpdateSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [title, originalTitle, year, policy, enabled, intervalMinutes, sourceIds, preferences]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        originalTitle: { type: string, maxLength: 300 }
        year: { type: integer, minimum: 0, maximum: 2100 }
        policy: { type: string, enum: [once, upgrade] }
        enabled: { type: boolean }
        intervalMinutes: { type: integer, minimum: 15, maximum: 10080 }
        sourceIds:
          type: array
          maxItems: 16
          items: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,49}$' }
        preferences: { $ref: '#/components/schemas/SubscriptionPreferences' }
    SetSubscriptionEnabledRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    Subscription:
      allOf:
        - $ref: '#/components/schemas/CreateSubscriptionRequest'
        - type: object
          required: [id, nextRunAt, createdAt, updatedAt]
          properties:
            id: { type: string }
            nextRunAt: { type: string, format: date-time }
            lastRunAt: { type: string, format: date-time }
            lastEpisode: { type: integer, minimum: 0, maximum: 10000 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    SubscriptionListResponse:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/Subscription' }
    SubscriptionRun:
      type: object
      required: [id, subscriptionId, triggerType, state, retryable, startedAt, updatedAt]
      properties:
        id: { type: string }
        subscriptionId: { type: string }
        triggerType: { type: string, enum: [scheduled, manual] }
        state:
          type: string
          enum: [queued, searching, retry_wait, no_match, duplicate, enqueued, completed, failed, needs_attention]
        sourceId: { type: string }
        transferJobId: { type: string }
        errorCode: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SubscriptionRunListResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionRun' }
    CreateTransferRequest:
      type: object
      required: [transferToken]
      properties:
        transferToken:
          type: string
          minLength: 1
          maxLength: 32768
    SetTransferArchivedRequest:
      type: object
      required: [archived]
      additionalProperties: false
      properties:
        archived: { type: boolean }
    TransferListResponse:
      type: object
      required: [transfers]
      properties:
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/TransferJob'
    TransferJob:
      type: object
      required: [id, title, year, mediaType, tmdbId, source, state, retryable, archived, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        year:
          type: integer
        season:
          type: integer
          minimum: 0
          maximum: 100
        episodeStart: { type: integer, minimum: 0, maximum: 10000 }
        episodeEnd: { type: integer, minimum: 0, maximum: 10000 }
        mediaType:
          type: string
          enum: [movie, series]
        tmdbId:
          type: string
          pattern: '^[1-9][0-9]*$'
        source:
          type: string
        state:
          $ref: '#/components/schemas/TransferState'
        errorCode:
          type: string
        errorMessage:
          type: string
        retryable:
          type: boolean
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransferJobDetail:
      allOf:
        - $ref: '#/components/schemas/TransferJob'
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/TransferEvent'
    TransferEvent:
      type: object
      required: [id, state, message, createdAt]
      properties:
        id:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/TransferState'
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    TransferState:
      type: string
      enum:
        - queued
        - transferring
        - retry_wait
        - transferred
        - submitting_sync
        - syncing
        - refreshing_emby
        - indexing_emby
        - verifying_playback
        - completed
        - failed
        - needs_attention
    SubscriptionBackup:
      type: object
      required: [version, exportedAt, subscriptions]
      properties:
        version: { type: integer, enum: [1] }
        exportedAt: { type: string, format: date-time }
        subscriptions:
          type: array
          minItems: 0
          maxItems: 1000
          items: { $ref: '#/components/schemas/CreateSubscriptionRequest' }
    SubscriptionImportResult:
      type: object
      required: [created, skipped]
      properties:
        created: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
    TransferNotification:
      type: object
      required: [id, jobId, eventType, jobState, title, state, attempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        jobId: { type: string }
        eventType: { type: string, enum: [completed, failed, needs_attention] }
        jobState: { $ref: '#/components/schemas/TransferState' }
        title: { type: string }
        state: { type: string, enum: [pending, submitting, sent, needs_attention] }
        attempts: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OperationalStatistics:
      type: object
      required: [transfersTotal, transfersActive, transfersCompleted, transfersFailed, transfersNeedsAttention, subscriptionsTotal, subscriptionsEnabled, runsTotal, runsFailed, commandsPending, commandsNeedsAttention, notificationsNeedsAttention]
      properties:
        transfersTotal: { type: integer, minimum: 0 }
        transfersActive: { type: integer, minimum: 0 }
        transfersCompleted: { type: integer, minimum: 0 }
        transfersFailed: { type: integer, minimum: 0 }
        transfersNeedsAttention: { type: integer, minimum: 0 }
        subscriptionsTotal: { type: integer, minimum: 0 }
        subscriptionsEnabled: { type: integer, minimum: 0 }
        runsTotal: { type: integer, minimum: 0 }
        runsFailed: { type: integer, minimum: 0 }
        commandsPending: { type: integer, minimum: 0 }
        commandsNeedsAttention: { type: integer, minimum: 0 }
        notificationsNeedsAttention: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
