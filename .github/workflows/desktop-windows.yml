name: desktop-windows

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: pnpm --dir desktop install --frozen-lockfile
      - name: Align desktop package version with tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python scripts/set-desktop-version.py "${GITHUB_REF_NAME#v}"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          includeRelease: true
          includeDebug: false
      - uses: actions/upload-artifact@v4
        with:
          name: media-hub-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

  publish-nas:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64, media-hub]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: media-hub-windows
          path: dist
      - name: Publish private desktop release on NAS
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          code=$((major * 1000000 + minor * 1000 + patch))
          exe=$(find dist -type f -name '*-setup.exe' | head -n 1)
          test -n "$exe"
          release_dir=/volume1/docker/media-hub/releases
          test -w "$release_dir"
          output="media-hub-${code}.exe"
          exe_tmp="$release_dir/.$output.tmp"
          manifest_tmp="$release_dir/.desktop-latest.json.tmp"
          install -m 0444 "$exe" "$exe_tmp"
          sha=$(sha256sum "$exe_tmp" | awk '{print $1}')
          size=$(stat -c '%s' "$exe_tmp")
          jq -n \
            --argjson versionCode "$code" \
            --arg versionName "$version" \
            --arg sha256 "$sha" \
            --argjson sizeBytes "$size" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode:$versionCode,versionName:$versionName,minimumSupportedVersionCode:1,sha256:$sha256,sizeBytes:$sizeBytes,publishedAt:$publishedAt,notes:""}' > "$manifest_tmp"
          chmod 0444 "$manifest_tmp"
          mv -f "$exe_tmp" "$release_dir/$output"
          mv -f "$manifest_tmp" "$release_dir/desktop-latest.json"
