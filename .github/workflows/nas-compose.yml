name: nas-compose

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v prefix; empty keeps current .env tag'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  up:
    runs-on: [self-hosted, linux, x64, media-hub]
    steps:
      - name: Start media-hub without waiting on mikan egress
        shell: bash
        run: |
          set -euo pipefail
          cd /volume1/docker/media-hub
          version="${{ github.event.inputs.version }}"
          version="${version#v}"
          if [ -n "$version" ]; then
            docker image inspect "ghcr.io/himym1/media-hub:${version}" >/dev/null
            if grep -Eq '^MEDIA_HUB_IMAGE_TAG=' .env; then
              sed -i.bak -E "s/^MEDIA_HUB_IMAGE_TAG=.*/MEDIA_HUB_IMAGE_TAG=${version}/" .env
            else
              printf '\nMEDIA_HUB_IMAGE_TAG=%s\n' "$version" >> .env
            fi
          fi
          grep -E '^MEDIA_HUB_IMAGE_TAG=' .env
          docker compose up -d --no-deps media-hub
          docker compose ps
          for _ in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail 80 media-hub >&2
          echo "NAS health check did not pass after compose up" >&2
          exit 1
