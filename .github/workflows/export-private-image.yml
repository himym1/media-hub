name: export-private-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY}:${version}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export linux/amd64 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" > export/image.json
          docker save "$IMAGE" | gzip -9 > export/image.tar.gz
          (
            cd export
            sha256sum image.json image.tar.gz > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: media-hub-${{ inputs.version }}-linux-amd64
          path: export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
