name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go -C backend test ./...
      - run: go -C backend vet ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web quality
      - run: pnpm --dir web test
      - run: pnpm --dir web lint
      - run: pnpm --dir web build
      - run: pnpm --dir web test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
        working-directory: android

  android-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            ./gradlew :app:connectedDebugAndroidTest
            mkdir -p app/build/reports/androidTests/connected/screenshots
            adb pull /sdcard/Android/data/com.mediahub.android/files/mediahub-segmented-control.png app/build/reports/androidTests/connected/screenshots/mediahub-segmented-control.png
            adb pull /sdcard/Android/data/com.mediahub.android/files/mediahub-large-font.png app/build/reports/androidTests/connected/screenshots/mediahub-large-font.png
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-report
          path: android/app/build/reports/androidTests/connected
          if-no-files-found: ignore
          retention-days: 7

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ruby scripts/check-openapi.rb api/openapi.yaml
