name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v prefix, e.g. 0.19.41'
        required: true
        type: string
      skip_image:
        description: 'Skip Docker image build (APK only)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: [self-hosted, linux, x64, media-hub]
    env:
      MEDIA_HUB_ANDROID_KEYSTORE_BASE64: ${{ secrets.MEDIA_HUB_ANDROID_KEYSTORE_BASE64 }}
      MEDIA_HUB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MEDIA_HUB_ANDROID_KEYSTORE_PASSWORD }}
      MEDIA_HUB_ANDROID_KEY_ALIAS: ${{ secrets.MEDIA_HUB_ANDROID_KEY_ALIAS }}
      MEDIA_HUB_ANDROID_KEY_PASSWORD: ${{ secrets.MEDIA_HUB_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout with NAS deploy key
        shell: bash
        run: |
          set -euo pipefail
          test "$PWD" = "$GITHUB_WORKSPACE"
          rm -rf -- ./* ./.??* 2>/dev/null || true
          git init -q .
          git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate release environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MEDIA_HUB_ANDROID_KEYSTORE_BASE64"
          test -n "$MEDIA_HUB_ANDROID_KEYSTORE_PASSWORD"
          test -n "$MEDIA_HUB_ANDROID_KEY_ALIAS"
          test -n "$MEDIA_HUB_ANDROID_KEY_PASSWORD"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          test -w /volume1/docker/media-hub/releases
          docker version >/dev/null
          java -version
      - name: Derive release version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            version="${version#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          IFS=. read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646161cecb50b75fc18d2b' > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PMEDIA_HUB_VERSION_NAME='${{ steps.version.outputs.name }}' -PMEDIA_HUB_VERSION_CODE='${{ steps.version.outputs.code }}'
      - name: Publish private Android release on NAS
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          release_dir=/volume1/docker/media-hub/releases
          output="media-hub-${{ steps.version.outputs.code }}.apk"
          apk_tmp="$release_dir/.$output.tmp"
          manifest_tmp="$release_dir/.latest.json.tmp"
          install -m 0444 "$apk" "$apk_tmp"
          sha=$(sha256sum "$apk_tmp" | awk '{print $1}')
          size=$(stat -c '%s' "$apk_tmp")
          jq -n \
            --argjson versionCode '${{ steps.version.outputs.code }}' \
            --arg versionName '${{ steps.version.outputs.name }}' \
            --arg sha256 "$sha" \
            --argjson sizeBytes "$size" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode:$versionCode,versionName:$versionName,minimumSupportedVersionCode:1,sha256:$sha256,sizeBytes:$sizeBytes,publishedAt:$publishedAt,notes:("Media Hub " + $versionName)}' > "$manifest_tmp"
          chmod 0444 "$manifest_tmp"
          mv -f "$apk_tmp" "$release_dir/$output"
          mv -f "$manifest_tmp" "$release_dir/latest.json"
      - name: Build amd64 image on NAS
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_image != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Dockerfile")
          text = path.read_text()
          old = "FROM gcr.io/distroless/static-debian12:nonroot\n"
          new = (
              "FROM alpine:3.20\n"
              "RUN apk add --no-cache ca-certificates tzdata \\\n"
              " && addgroup -g 65532 -S nonroot \\\n"
              " && adduser -u 65532 -S -G nonroot -H -D nonroot\n"
          )
          if old not in text:
              raise SystemExit("expected distroless base image was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Aliyun GOPROXY only. Clash on :7890 corrupts those module zips.
          # Do not rewrite the module RUN. VERSION is declared after download.
          timeout 20m docker build --network=host --platform linux/amd64 \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg GOPROXY=https://mirrors.aliyun.com/goproxy/,direct \
            --build-arg GOSUMDB=off \
            -t "$image:${{ steps.version.outputs.name }}" \
            -t "$image:${GITHUB_SHA}" .
      - name: Switch NAS compose to the new image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_image != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.name }}"
          cd /volume1/docker/media-hub
          ./backup.sh
          if grep -Eq '^MEDIA_HUB_IMAGE_TAG=' .env; then
            sed -i.bak -E "s/^MEDIA_HUB_IMAGE_TAG=.*/MEDIA_HUB_IMAGE_TAG=${version}/" .env
          else
            printf '\nMEDIA_HUB_IMAGE_TAG=%s\n' "$version" >> .env
          fi
          MEDIA_HUB_IMAGE_TAG="$version" docker compose up -d --no-deps media-hub
          MEDIA_HUB_IMAGE_TAG="$version" docker compose up -d || true
          for _ in $(seq 1 10); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health; then
              exit 0
            fi
            sleep 3
          done
          echo "NAS health check did not pass after compose up" >&2
          exit 1
