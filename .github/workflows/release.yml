name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  packages: write

jobs:
  image:
    runs-on: [self-hosted, linux, x64, media-hub]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Login to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push amd64 image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          major_minor="${version%.*}"
          docker build --platform linux/amd64 --build-arg VERSION="$GITHUB_REF_NAME" -t "$image:$version" -t "$image:$major_minor" -t "$image:${GITHUB_SHA}" .
          docker push "$image:$version"
          docker push "$image:$major_minor"
          docker push "$image:${GITHUB_SHA}"

  android:
    runs-on: [self-hosted, linux, x64, media-hub]
    env:
      MEDIA_HUB_ANDROID_KEYSTORE_BASE64: ${{ secrets.MEDIA_HUB_ANDROID_KEYSTORE_BASE64 }}
      MEDIA_HUB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MEDIA_HUB_ANDROID_KEYSTORE_PASSWORD }}
      MEDIA_HUB_ANDROID_KEY_ALIAS: ${{ secrets.MEDIA_HUB_ANDROID_KEY_ALIAS }}
      MEDIA_HUB_ANDROID_KEY_PASSWORD: ${{ secrets.MEDIA_HUB_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Validate Android signing configuration
        shell: bash
        run: |
          test -n "$MEDIA_HUB_ANDROID_KEYSTORE_BASE64"
          test -n "$MEDIA_HUB_ANDROID_KEYSTORE_PASSWORD"
          test -n "$MEDIA_HUB_ANDROID_KEY_ALIAS"
          test -n "$MEDIA_HUB_ANDROID_KEY_PASSWORD"
      - name: Verify preinstalled Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          java -version
      - name: Derive release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PMEDIA_HUB_VERSION_NAME='${{ steps.version.outputs.name }}' -PMEDIA_HUB_VERSION_CODE='${{ steps.version.outputs.code }}'
      - name: Build private release manifest
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          output="media-hub-${{ steps.version.outputs.code }}.apk"
          cp "$apk" "$output"
          sha=$(sha256sum "$output" | awk '{print $1}')
          size=$(stat -c '%s' "$output")
          jq -n \
            --argjson versionCode '${{ steps.version.outputs.code }}' \
            --arg versionName '${{ steps.version.outputs.name }}' \
            --arg sha256 "$sha" \
            --argjson sizeBytes "$size" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode:$versionCode,versionName:$versionName,minimumSupportedVersionCode:1,sha256:$sha256,sizeBytes:$sizeBytes,publishedAt:$publishedAt,notes:("Media Hub " + $versionName)}' > latest.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            media-hub-${{ steps.version.outputs.code }}.apk
            latest.json
