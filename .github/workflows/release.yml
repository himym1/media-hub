name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  android:
    runs-on: ubuntu-latest
    env:
      MEDIA_HUB_ANDROID_KEYSTORE_BASE64: ${{ secrets.MEDIA_HUB_ANDROID_KEYSTORE_BASE64 }}
      MEDIA_HUB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MEDIA_HUB_ANDROID_KEYSTORE_PASSWORD }}
      MEDIA_HUB_ANDROID_KEY_ALIAS: ${{ secrets.MEDIA_HUB_ANDROID_KEY_ALIAS }}
      MEDIA_HUB_ANDROID_KEY_PASSWORD: ${{ secrets.MEDIA_HUB_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android signing configuration
        shell: bash
        run: |
          test -n "$MEDIA_HUB_ANDROID_KEYSTORE_BASE64"
          test -n "$MEDIA_HUB_ANDROID_KEYSTORE_PASSWORD"
          test -n "$MEDIA_HUB_ANDROID_KEY_ALIAS"
          test -n "$MEDIA_HUB_ANDROID_KEY_PASSWORD"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Derive release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PMEDIA_HUB_VERSION_NAME='${{ steps.version.outputs.name }}' -PMEDIA_HUB_VERSION_CODE='${{ steps.version.outputs.code }}'
      - name: Build private release manifest
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          output="media-hub-${{ steps.version.outputs.code }}.apk"
          cp "$apk" "$output"
          sha=$(sha256sum "$output" | awk '{print $1}')
          size=$(stat -c '%s' "$output")
          jq -n \
            --argjson versionCode '${{ steps.version.outputs.code }}' \
            --arg versionName '${{ steps.version.outputs.name }}' \
            --arg sha256 "$sha" \
            --argjson sizeBytes "$size" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode:$versionCode,versionName:$versionName,minimumSupportedVersionCode:1,sha256:$sha256,sizeBytes:$sizeBytes,publishedAt:$publishedAt,notes:("Media Hub " + $versionName)}' > latest.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            media-hub-${{ steps.version.outputs.code }}.apk
            latest.json
