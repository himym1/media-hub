[package]
name = "media-hub-desktop"
version = "0.21.25"
description = "Media Hub desktop shell"
authors = ["Media Hub"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "media_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
