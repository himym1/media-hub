[package]
name = "media-hub-desktop"
version = "0.20.33"
description = "Media Hub desktop shell"
authors = ["Media Hub"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "media_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
